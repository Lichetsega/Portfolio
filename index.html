    function AiAssistant() {
      const [messages, setMessages] = useState([
        {
          role: 'bot',
          text: "Hello! I am Liche's interactive neural agent. Feel free to ask about her Agentic RAG systems, 6-month AI engineering at INSA, backend architectures, or job availability!"
        }
      ]);
      const [inputValue, setInputValue] = useState('');
      const [isTyping, setIsTyping] = useState(false);
      const transcriptEndRef = useRef(null);

      const scrollToBottom = () => {
        transcriptEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      };

      useEffect(() => {
        scrollToBottom();
      }, [messages, isTyping]);

      const getAgentAnswer = (query) => {
        const q = query.toLowerCase();
        if (q.includes('insa') || q.includes('internship') || q.includes('experience') || q.includes('work')) {
          return aiKnowledgeBase.insa;
        }
        if (q.includes('rag') || q.includes('agent') || q.includes('retrieval') || q.includes('vector') || q.includes('chromadb')) {
          return aiKnowledgeBase.rag;
        }
        if (q.includes('voice') || q.includes('gemini') || q.includes('assistant') || q.includes('websocket')) {
          return aiKnowledgeBase.assistant;
        }
        if (q.includes('backend') || q.includes('database') || q.includes('stack') || q.includes('fastapi') || q.includes('postgres')) {
          return aiKnowledgeBase.backend;
        }
        if (q.includes('jimma') || q.includes('university') || q.includes('education') || q.includes('degree')) {
          return aiKnowledgeBase.education;
        }
        if (q.includes('contact') || q.includes('hire') || q.includes('available') || q.includes('email') || q.includes('telegram')) {
          return aiKnowledgeBase.availability;
        }
        if (q.includes('project') || q.includes('portfolio') || q.includes('ethiopia') || q.includes('code')) {
          return aiKnowledgeBase.projects;
        }
        return aiKnowledgeBase.default;
      };

      const handleSend = (textToSend) => {
        const q = (textToSend || inputValue).trim();
        if (!q) return;

        const newMessages = [...messages, { role: 'user', text: q }];
        setMessages(newMessages);
        setInputValue('');
        setIsTyping(true);

        setTimeout(() => {
          const response = getAgentAnswer(q);
          setMessages([...newMessages, { role: 'bot', text: response }]);
          setIsTyping(false);
        }, 450);
      };

      const handleClear = () => {
        setMessages([
          {
            role: 'bot',
            text: "Transcript reset. Ask me anything regarding Liche's projects, experience, or tech stack!"
          }
        ]);
      };

      return (
        <section className="section" id="assistant">
          <div className="container">
            <div className="section-header">
              <div className="section-tag">
                <span>Interactive AI Demo</span>
              </div>
              <h2 className="section-title">Query Li's Agent Simulator</h2>
              <p className="section-subtitle">
                Experience intent routing logic inspired by <strong>Li's AI Voice Assistant</strong> & <strong>Visit Ethiopia Agentic RAG</strong>.
              </p>
            </div>

            <div className="card-glass ai-sim-box">
              <div className="ai-sim-topbar">
                <div className="ai-agent-status">
                  <span className="pulse-indicator"></span>
                  <span>Neural Agent: Online • Fast Latency</span>
                </div>

                <button
                  onClick={handleClear}
                  className="btn-ghost btn-sm"
                  style={{ fontSize: '0.8rem', cursor: 'pointer', border: 'none' }}
                  title="Clear transcript"
                >
                  Clear Chat
                </button>
              </div>

              <div className="ai-chips-group">
                {samplePrompts.map((item, index) => (
                  <button
                    key={index}
                    onClick={() => handleSend(item.query)}
                    className="ai-chip-prompt"
                  >
                    {item.label}
                  </button>
                ))}
              </div>

              <div className="chat-transcript-area">
                {messages.map((msg, idx) => (
                  <div
                    key={idx}
                    className={`chat-bubble-row ${msg.role === 'user' ? 'user-row' : ''}`}
                  >
                    <div
                      className={`chat-avatar-indicator ${
                        msg.role === 'user' ? 'user-avatar' : 'bot-avatar'
                      }`}
                    >
                      {msg.role === 'user' ? 'YOU' : 'LT'}
                    </div>

                    <div
                      className={`chat-bubble-content ${
                        msg.role === 'user' ? 'user-bubble' : 'bot-bubble'
                      }`}
                    >
                      {msg.text}
                    </div>
                  </div>
                ))}

                {isTyping && (
                  <div className="chat-bubble-row">
                    <div className="chat-avatar-indicator bot-avatar">LT</div>
                    <div className="chat-bubble-content bot-bubble" style={{ color: 'var(--text-muted)' }}>
                      <span>Synthesizing answer...</span>
                    </div>
                  </div>
                )}

                <div ref={transcriptEndRef} />
              </div>

              <form
                onSubmit={(e) => {
                  e.preventDefault();
                  handleSend();
                }}
                className="chat-input-row"
              >
                <input
                  type="text"
                  placeholder="Ask about Liche's AI architecture, INSA experience, or tech stack..."
                  value={inputValue}
                  onChange={(e) => setInputValue(e.target.value)}
                  className="chat-input-field"
                />
                <button type="submit" className="btn btn-primary" aria-label="Send Message">
                  <span>Send</span>
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                    <line x1="22" y1="2" x2="11" y2="13"></line>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                  </svg>
                </button>
              </form>
            </div>
          </div>
        </section>
      );
    }

                        <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z" />
                      </svg>
                    </div>
                    <div>
                      <div className="channel-label">GitHub</div>
                      <div className="channel-value">{personalInfo.githubHandle} (29 Repos)</div>
                    </div>
                  </div>

                  <span style={{ color: 'var(--text-muted)', fontSize: '0.85rem' }}>View →</span>
                </a>
              </div>

              <div className="card-glass contact-card">
                <h3 style={{ fontSize: '1.35rem', fontWeight: 700, marginBottom: '0.75rem', color: 'var(--text-primary)' }}>
                  Send a Direct Message
                </h3>
                <p style={{ color: 'var(--text-secondary)', fontSize: '0.94rem', marginBottom: '1.75rem' }}>
                  Have a role, project, or technical question? Leave a note and I'll get back to you promptly.
                </p>

                <form onSubmit={handleSubmit}>
                  <div className="form-group">
                    <label className="form-label" htmlFor="name">Your Name</label>
                    <input
                      type="text"
                      id="name"
                      placeholder="e.g. Alex Chen"
                      value={formState.name}
                      onChange={(e) => setFormState({ ...formState, name: e.target.value })}
                      className="form-input"
                      required
                    />
                  </div>

                  <div className="form-group">
                    <label className="form-label" htmlFor="email">Your Email</label>
                    <input
                      type="email"
                      id="email"
                      placeholder="e.g. alex@company.com"
                      value={formState.email}
                      onChange={(e) => setFormState({ ...formState, email: e.target.value })}
                      className="form-input"
                      required
                    />
                  </div>

                  <div className="form-group">
                    <label className="form-label" htmlFor="message">Message</label>
                    <textarea
                      id="message"
                      rows="4"
                      placeholder="Tell me about your team, project requirements, or opportunity..."
                      value={formState.message}
                      onChange={(e) => setFormState({ ...formState, message: e.target.value })}
                      className="form-textarea"
                      required
                    />
                  </div>

                  <button type="submit" className="btn btn-primary" style={{ width: '100%' }}>
                    <span>Send Message</span>
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                      <path d="M5 12h14M12 5l7 7-7 7" />
                    </svg>
                  </button>

                  {submitted && (
                    <div className="form-alert form-alert-success">
                      ✓ Thank you! Your message has been received. Liche will reach out to you promptly.
                    </div>
                  )}
                </form>
              </div>
            </div>
          </div>
        </section>
      );
    }

    function Footer() {
      const scrollToTop = () => {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      return (
        <footer className="footer">
          <div className="container footer-container">
            <div>
              <div style={{ display: 'flex', alignItems: 'center', gap: '0.65rem', marginBottom: '0.35rem' }}>
                <span className="monogram-badge" style={{ width: '28px', height: '28px', fontSize: '0.75rem' }}>LT</span>
                <span style={{ fontWeight: 700, fontSize: '1rem', color: 'var(--text-primary)' }}>{personalInfo.name}</span>
              </div>
              <div className="footer-copy">
                B.Sc. Software Engineering Candidate • Jimma University • Ethiopia
              </div>
            </div>

            <div className="footer-links-group">
              <a href={personalInfo.github} target="_blank" rel="noopener noreferrer" className="footer-link">
                GitHub
              </a>
              <a href={personalInfo.linkedin} target="_blank" rel="noopener noreferrer" className="footer-link">
                LinkedIn
              </a>
              <a href={personalInfo.telegram} target="_blank" rel="noopener noreferrer" className="footer-link">
                Telegram
              </a>
              <a href={personalInfo.resumePath} target="_blank" rel="noopener noreferrer" download className="footer-link">
                Resume (PDF)
              </a>
              <button
                onClick={scrollToTop}
                className="btn-ghost btn-sm"
                style={{ cursor: 'pointer', border: 'none', color: 'var(--accent-primary)', fontWeight: 600 }}
              >
                ↑ Top
              </button>
            </div>
          </div>
        </footer>
      );
    }

    function FloatingChatbot() {
      const [isOpen, setIsOpen] = useState(false);
      const [showTooltip, setShowTooltip] = useState(true);
      const [messages, setMessages] = useState([
        {
          role: 'bot',
          text: "Hi there! I'm Li's Virtual Assistant. Ask me about Liche's AI engineering at INSA, Agentic RAG projects, tech stack, or full-time availability!"
        }
      ]);
      const [inputValue, setInputValue] = useState('');
      const [isTyping, setIsTyping] = useState(false);
      const messagesEndRef = useRef(null);

      const scrollToBottom = () => {
        messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      };

      useEffect(() => {
        if (isOpen) {
          scrollToBottom();
        }
      }, [messages, isOpen, isTyping]);

      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.key === 'Escape' && isOpen) {
            setIsOpen(false);
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [isOpen]);

      const getAnswer = (q) => {
        const query = q.toLowerCase();
        if (query.includes('insa') || query.includes('internship') || query.includes('experience') || query.includes('work')) {
          return aiKnowledgeBase.insa;
        }
        if (query.includes('rag') || query.includes('agent') || query.includes('retrieval') || query.includes('vector') || query.includes('chromadb')) {
          return aiKnowledgeBase.rag;
        }
        if (query.includes('voice') || query.includes('gemini') || query.includes('assistant') || query.includes('websocket')) {
          return aiKnowledgeBase.assistant;
        }
        if (query.includes('backend') || query.includes('database') || query.includes('stack') || query.includes('fastapi') || query.includes('postgres')) {
          return aiKnowledgeBase.backend;
        }
        if (query.includes('jimma') || query.includes('university') || query.includes('education') || query.includes('degree')) {
          return aiKnowledgeBase.education;
        }
        if (query.includes('contact') || query.includes('hire') || query.includes('available') || query.includes('email') || query.includes('telegram')) {
          return aiKnowledgeBase.availability;
        }
        if (query.includes('project') || query.includes('ethiopia') || query.includes('code')) {
          return aiKnowledgeBase.projects;
        }
        return aiKnowledgeBase.default;
      };

      const handleSendMessage = (textToSend) => {
        const q = (textToSend || inputValue).trim();
        if (!q) return;

        const newMsgs = [...messages, { role: 'user', text: q }];
        setMessages(newMsgs);
        setInputValue('');
        setIsTyping(true);

        setTimeout(() => {
          const reply = getAnswer(q);
          setMessages([...newMsgs, { role: 'bot', text: reply }]);
          setIsTyping(false);
        }, 450);
      };

      return (
        <div className="floating-chatbot-container">
          {isOpen && (
            <div className="chatbot-window card-glass" role="dialog" aria-label="Li's AI Virtual Assistant">
              <div className="chatbot-window-header">
                <div className="chatbot-header-info">
                  <div className="chatbot-avatar-pill">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                      <path d="M12 2a2 2 0 0 1 2 2v2a2 2 0 0 1-2 2 2 2 0 0 1-2-2V4a2 2 0 0 1 2-2z" />
                      <rect x="3" y="8" width="18" height="12" rx="4" />
                      <circle cx="8" cy="14" r="1.5" fill="currentColor" />
                      <circle cx="16" cy="14" r="1.5" fill="currentColor" />
                      <path d="M9 18h6" />
                    </svg>
                  </div>
                  <div>
                    <div className="chatbot-header-title">Li's AI Assistant</div>
                    <div className="chatbot-header-sub">
                      <span className="pulse-indicator-small"></span>
                      <span>Online • AI Knowledge Engine</span>
                    </div>
                  </div>
                </div>

                <button
                  onClick={() => setIsOpen(false)}
                  className="chatbot-close-btn"
                  aria-label="Close assistant window"
                >
                  ✕
                </button>
              </div>

              <div className="chatbot-chips-bar">
                {samplePrompts.slice(0, 3).map((prompt, i) => (
                  <button
                    key={i}
                    onClick={() => handleSendMessage(prompt.query)}
                    className="chatbot-quick-chip"
                  >
                    {prompt.label}
                  </button>
                ))}
              </div>

              <div className="chatbot-messages-scroll">
                {messages.map((m, idx) => (
                  <div
                    key={idx}
                    className={`chatbot-msg-bubble ${m.role === 'user' ? 'user-bubble' : 'bot-bubble'}`}
                  >
                    {m.text}
                  </div>
                ))}

                {isTyping && (
                  <div className="chatbot-msg-bubble bot-bubble typing-dots">
                    <span>•</span>
                    <span>•</span>
                    <span>•</span>
                  </div>
                )}
                <div ref={messagesEndRef} />
              </div>

              <form
                onSubmit={(e) => {
                  e.preventDefault();
                  handleSendMessage();
                }}
                className="chatbot-input-form"
              >
                <input
                  type="text"
                  placeholder="Ask me anything..."
                  value={inputValue}
                  onChange={(e) => setInputValue(e.target.value)}
                  className="chatbot-text-input"
                />
                <button type="submit" className="chatbot-send-btn" aria-label="Send">
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                    <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z" />
                  </svg>
                </button>
              </form>
            </div>
          )}

          <div className="chatbot-fab-cluster">
            {!isOpen && showTooltip && (
              <div
                className="chatbot-callout-pill"
                onClick={() => {
                  setIsOpen(true);
                  setShowTooltip(false);
                }}
              >
                <span className="pulse-indicator-small"></span>
                <span>Chat with Li's Assistant</span>
                <button
                  onClick={(e) => {
                    e.stopPropagation();
                    setShowTooltip(false);
                  }}
                  className="callout-dismiss-btn"
                  title="Dismiss"
                >
                  ✕
                </button>
              </div>
            )}

            <button
              onClick={() => {
                setIsOpen(!isOpen);
                if (!isOpen) setShowTooltip(false);
              }}
              className={`chatbot-fab-btn ${isOpen ? 'active-open' : ''}`}
              aria-label={isOpen ? "Close AI Assistant" : "Open AI Assistant"}
              title={isOpen ? "Close AI Assistant" : "Chat with Li's Assistant"}
            >
              {isOpen ? (
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5">
                  <line x1="18" y1="6" x2="6" y2="18"></line>
                  <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
              ) : (
                <>
                  <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                    <rect x="4" y="6" width="16" height="12" rx="4" />
                    <line x1="12" y1="2" x2="12" y2="6" />
                    <circle cx="12" cy="2" r="1" fill="currentColor" />
                    <circle cx="9" cy="12" r="1.5" fill="currentColor" />
                    <circle cx="15" cy="12" r="1.5" fill="currentColor" />
                    <path d="M9 15c.67.67 1.33 1 3 1s2.33-.33 3-1" />
                    <path d="M2 12h2M20 12h2" />
                  </svg>
                  <span className="fab-online-dot"></span>
                </>
              )}
            </button>
          </div>
        </div>
      );
    }

    // --- Top-Level Root Component ---
    function App() {
      const [theme, setTheme] = useState(() => {
        return localStorage.getItem('liche_portfolio_theme') || 'dark';
      });

      useEffect(() => {
        document.documentElement.setAttribute('data-theme', theme);
        localStorage.setItem('liche_portfolio_theme', theme);
      }, [theme]);

      const toggleTheme = () => {
        setTheme((prev) => (prev === 'dark' ? 'light' : 'dark'));
      };

      return (
        <div className="app-root">
          <div className="bg-subtle-grid" />
          <Navbar theme={theme} toggleTheme={toggleTheme} />
          <main>
            <Hero />
            <About />
            <Experience />
            <Skills />
            <Projects />
            <AiAssistant />
            <Contact />
          </main>
          <Footer />
          <FloatingChatbot />
        </div>
      );
    }

    // Mount Application
    const rootElement = document.getElementById('root');
    ReactDOM.createRoot(rootElement).render(<App />);
  </script>
</body>
</html>
